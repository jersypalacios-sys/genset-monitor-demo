function maintenance(){let alarms=mockFleet.map(x=>({...x,used:x.hours-x.lastPM})).filter(x=>x.used>=230).sort((a,b)=>b.used-a.used);return baseHeader('Control de mantenimiento','Ejemplo de mantenimiento preventivo basado en horas desde el último servicio.')+`<div class="notice cool">Regla: horómetro total − horómetro del último PM. A <b>230 h</b> generar prealerta; a <b>250 h</b>, indicar vencimiento. Datos ficticios.</div><div class="grid-kpis"><div class="card kpi"><small>Intervalo de mantenimiento</small><b>250 h</b><span>Ejemplo de política</span></div><div class="card kpi"><small>Alarma anticipada</small><b>230 h</b><span>20 horas antes del PM</span></div><div class="card kpi"><small>Equipos con PM por revisar</small><b>${alarms.length}</b><span>Solo demostración</span></div><div class="card kpi"><small>GNSS conectado</small><b>0</b><span>Sin enlace real</span></div></div><div class="card panel"><div class="table-wrap"><table class="table"><thead><tr><th>GENSET</th><th>Horómetro</th><th>Último PM</th><th>Horas del ciclo</th><th>Aviso</th></tr></thead><tbody>${alarms.map(x=>`<tr><td><b>${x.id}</b></td><td>${fmt(x.hours)} h</td><td>${fmt(x.lastPM)} h</td><td>${fmt(x.used)} h</td><td><span class="tag ${x.used>=250?'alarm':'pending'}">${x.used>=250?'PM VENCIDO':'PROGRAMAR PM'}</span></td></tr>`).join('')}</tbody></table></div></div>`;}
function qrPage(){return baseHeader('QR para GENSET móviles','El código QR identifica un equipo, pero no equivale a un rastreador GNSS.')+`<div class="notice">Esta demostración pública no genera enlaces a ubicaciones reales. En producción, el QR deberá abrir una ficha en un servidor autorizado y exigir autenticación y permiso de ubicación.</div><div class="card panel"><h2>Prueba segura</h2><p class="sub">Puedes ver los 18 equipos ficticios, sin registrar coordenadas de personas ni enviar posiciones a Internet.</p><div class="stations-grid">${mockFleet.filter(x=>x.type==='Móvil').map(x=>`<div class="station-tile"><b>▦ ${x.id}</b><small>QR de seguimiento: pendiente de servidor</small><small>Ubicación: no conectada</small></div>`).join('')}</div></div>`;}
function rad(deg){return deg*Math.PI/180}
function hav(a,b){let dlat=rad(b.lat-a.lat),dlon=rad(b.lon-a.lon);let h=Math.sin(dlat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dlon/2)**2;return 2*6371*Math.asin(Math.sqrt(h));}
function computeRoute(){let start=allPositions.find(x=>x.isOrigin)||allPositions[0];let remaining=allPositions.filter(x=>x!==start);let visited=[start];if(routeMode==='priority')remaining=remaining.slice(0,Math.min(5,remaining.length));while(remaining.length){let p=visited[visited.length-1],best=0;for(let i=1;i<remaining.length;i++)if(hav(p,remaining[i])<hav(p,remaining[best]))best=i;visited.push(remaining.splice(best,1)[0]);}route=visited;}
function routeKm(){let total=0;for(let i=1;i<route.length;i++)total+=hav(route[i-1],route[i]);return total;}
function mapPage(){computeRoute();return baseHeader('Ubicaciones y geolocalización','Mapa interactivo de estacionarios y recorrido desde el Taller de Electricidad.',`<button class="btn" data-action="resetDemo">↺ Restaurar KMZ original</button>`)+`<div class="notice"><strong>${imported?'ARCHIVO ADICIONAL IMPORTADO LOCALMENTE':'KMZ ORIGINAL PRECARGADO · 19 ESTACIONARIOS + TALLER'}:</strong> ${imported?'Los puntos del archivo adicional seleccionado se leen en tu navegador y no quedan guardados en GitHub.':'Los nombres, TAG y coordenadas coinciden con el archivo GENSET ESTACIONARIOS .kmz que enviaste. ATENCIÓN: al publicar este HTML en GitHub Pages, cualquier visitante podrá ver esos puntos. Los estados y horómetros siguen siendo simulados.'}</div><div class="card panel"><div class="file-drop"><label>📁 Actualizar coordenadas usando otro KMZ, KML o GeoJSON (opcional)</label><p>Los 20 puntos originales ya aparecen automáticamente. Usa este control solo si quieres comprobar otro archivo; esa importación adicional es local. La vista satelital externa está desactivada por defecto.</p><div class="filter-row"><input id="importGeo" type="file" accept=".kmz,.kml,.geojson,.json,application/vnd.google-earth.kmz,application/vnd.google-earth.kml+xml,application/geo+json"><span class="pill ${imported?'good':'blue'}" id="dataModeLabel">${imported?`${allPositions.length-1} estacionarios importados`:'19 estacionarios del KMZ original'}</span></div></div></div><div class="map-layout"><div class="card map-panel"><div class="map-heading"><div><h2>Mapa de GENSET estacionarios</h2><span class="sub">Arrastra para mover · Rueda del mouse o +/- para ampliar · Pulsa un marcador</span></div><div class="actions"><button class="btn" data-action="satellite">${satEnabled?'✕ Desactivar satélite':'▧ Vista satelital (opcional)'}</button><button class="btn" data-action="fit">⌖ Centrar puntos</button></div></div><div class="map" id="stationMap"><div class="map-layer" id="mapLayer"></div><div class="map-controls"><button type="button" data-action="zoomIn" aria-label="Acercar">+</button><button type="button" data-action="zoomOut" aria-label="Alejar">−</button><button type="button" data-action="fit" aria-label="Centrar">⌖</button></div><div class="map-credit" id="mapCredit">${satEnabled?'Imágenes: Esri · coordenadas enviadas al proveedor de mosaicos':'Mapa vectorial local · sin proveedor externo de mapas'}</div></div><p class="sub">${imported?'Ubicaciones del KMZ adicional cargado localmente':'Ubicaciones documentales exactas del KMZ original precargado'} · Recorridos dibujados en línea recta; no indican vías transitables ni tiempo de viaje.</p></div><div class="card side-route"><h2>Recorrido desde el Taller</h2><p class="sub">Selecciona los primeros cinco o todos los estacionarios. Los tramos son distancias en línea recta.</p><select class="select" id="routeMode"><option value="priority" ${routeMode==='priority'?'selected':''}>5 equipos · Ruta de muestra</option><option value="all" ${routeMode==='all'?'selected':''}>Todos los estacionarios</option></select><div style="background:#edf3fb;padding:15px;border-radius:10px;margin:15px 0"><b style="font-size:26px;color:#2463a7">${routeKm().toFixed(2)} km</b><div class="sub">Distancia geométrica acumulada</div></div>${route.map((x,i)=>`<div class="route-chip" data-pick="${esc(x.id)}" role="button" tabindex="0"><span class="route-num ${i===0?'first':''}">${i===0?'T':i}</span><div><b>${esc(x.name)}</b><small>${esc(x.id)}${i>0?` · ${hav(route[i-1],x).toFixed(2)} km`: ' · Origen'}</small></div></div>`).join('')}</div></div><div class="card panel" style="margin-top:17px"><div class="map-heading"><h2>Marcadores del mapa</h2><span class="pill blue">${allPositions.length-1} estacionarios + 1 Taller</span></div><div class="stations-grid">${allPositions.map(x=>`<button class="station-tile" data-pick="${esc(x.id)}"><b>${x.isOrigin?'⌖ ': '⚡ '}${esc(x.name)}</b><small>${esc(x.id)}</small><small>${x.lat.toFixed(6)}, ${x.lon.toFixed(6)}</small></button>`).join('')}</div></div>`;}
// Only standard-browser APIs are used. No fetch() or other uploads occur.
function merc(lat,lon,z){let s=256*2**z,t=Math.min(85.05112878,Math.max(-85.05112878,lat)),r=rad(t);return {x:(lon+180)/360*s,y:(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*s};}
function getMapView(){let el=$('stationMap');return {width:el.clientWidth,height:el.clientHeight};}
function project(p){let c=merc(mapState.lat,mapState.lon,mapState.zoom),pos=merc(p.lat,p.lon,mapState.zoom),{width,height}=getMapView();return {x:width/2+(pos.x-c.x),y:height/2+(pos.y-c.y)};}
function mapTiles(){let {width,height}=getMapView(),z=mapState.zoom,c=merc(mapState.lat,mapState.lon,z),n=2**z;let left=c.x-width/2,top=c.y-height/2;let startX=Math.floor(left/256),endX=Math.floor((left+width)/256),startY=Math.floor(top/256),endY=Math.floor((top+height)/256),html='';for(let x=startX;x<=endX;x++)for(let y=startY;y<=endY;y++){if(y<0||y>=n)continue;let wx=((x%n)+n)%n;html+=`<img class="map-tile" alt="" loading="lazy" src="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${wx}" style="left:${Math.round(x*256-left)}px;top:${Math.round(y*256-top)}px">`;}return html;}
function redrawMap(){if(view!=='map'||!$('stationMap'))return;let {width,height}=getMapView(),points=allPositions.map(p=>({...p,...project(p)}));let routePts=route.map(p=>project(p)),d=routePts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');let tiles=satEnabled?mapTiles():'<div class="map-grid"></div>';let html=`<div class="map-tiles">${tiles}</div><div class="map-overlays"><svg class="route-svg" viewBox="0 0 ${width} ${height}"><polyline points="${d}" stroke="#ffffffa8" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="${d}" stroke="#e6a824" stroke-width="3.5" stroke-dasharray="9 6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>${points.map(p=>(p.x<-20||p.y<-20||p.x>width+20||p.y>height+20)?'':`<button class="marker ${p.isOrigin?'origin':''} ${selected===p.id?'selected':''}" type="button" data-pick="${esc(p.id)}" title="${esc(p.name)}" style="left:${p.x.toFixed(1)}px;top:${p.y.toFixed(1)}px">${p.isOrigin?'T':'⚡'}</button>`).join('')}</div>`;let s=points.find(x=>x.id===selected);if(s)html+=`<div class="map-popup"><button type="button" data-action="clearSelected">Cerrar ✕</button><b>${esc(s.name)}</b><p>${esc(s.id)} · ${s.isOrigin?'Punto de partida':'GENSET estacionario'}</p><p>Latitud: ${s.lat.toFixed(6)} · Longitud: ${s.lon.toFixed(6)}</p><p>${imported?'Procedencia: KMZ adicional importado':'Procedencia: GENSET ESTACIONARIOS .kmz · documental'}</p></div>`;$('mapLayer').innerHTML=html;}
function fitMap(){if(!allPositions.length)return;let el=$('stationMap');if(!el)return;let lats=allPositions.map(x=>x.lat),lons=allPositions.map(x=>x.lon);let minLat=Math.min(...lats),maxLat=Math.max(...lats),minLon=Math.min(...lons),maxLon=Math.max(...lons);mapState.lat=(minLat+maxLat)/2;mapState.lon=(minLon+maxLon)/2;let {width,height}=getMapView();for(let z=16;z>=3;z--){let a=merc(minLat,minLon,z),b=merc(maxLat,maxLon,z);if(Math.abs(b.x-a.x)<=width-100&&Math.abs(b.y-a.y)<=height-100){mapState.zoom=z;break;}}redrawMap();}
function zoom(inc){mapState.zoom=Math.min(18,Math.max(3,mapState.zoom+inc));redrawMap();}
function selectPoint(id){let p=allPositions.find(x=>x.id===id);if(!p)return;selected=id;mapState.lat=p.lat;mapState.lon=p.lon;mapState.zoom=Math.max(11,mapState.zoom);redrawMap();$('stationMap')?.scrollIntoView({block:'center',behavior:'smooth'});}
function normalizeImported(pts){let good=pts.filter(x=>Number.isFinite(x.lat)&&Number.isFinite(x.lon)&&Math.abs(x.lat)<=90&&Math.abs(x.lon)<=180).map((p,i)=>({id:String(p.id||`LOC-${i+1}`).slice(0,120),name:String(p.name||`Ubicación ${i+1}`).slice(0,160),lat:p.lat,lon:p.lon,source:'KMZ local',isOrigin:/taller.*electric|punto de partida/i.test(String(p.name||''))}));if(good.length>120)throw Error('El archivo supera el máximo de 120 puntos para la demostración.');if(good.length<2)throw Error('El archivo no tiene suficientes puntos con coordenadas válidas.');let idSeen=new Map();good.forEach(p=>{let c=idSeen.get(p.id)||0;idSeen.set(p.id,c+1);if(c)p.id+='-'+(c+1)});if(!good.some(x=>x.isOrigin))toast('No se encontró Taller de Electricidad; el primer punto se tomará como origen.');if(!good.some(x=>x.isOrigin))good[0].isOrigin=true;return good;}
function getName(parent,tag){return Array.from(parent.children).find(e=>e.localName===tag)?.textContent?.trim()||''}
function parseKML(content){let doc=new DOMParser().parseFromString(content,'application/xml');if(doc.querySelector('parsererror'))throw Error('El KML contiene errores de formato XML.');let placemarks=Array.from(doc.getElementsByTagName('*')).filter(x=>x.localName==='Placemark'),points=[];for(let p of placemarks){let name=getName(p,'name');let point=Array.from(p.getElementsByTagName('*')).find(x=>x.localName==='Point');if(!point)continue;let coord=Array.from(point.getElementsByTagName('*')).find(x=>x.localName==='coordinates')?.textContent?.trim();if(!coord)continue;let [lon,lat]=coord.split(/[,\s]+/).map(Number);let idm=name.match(/(?:\d{2,4}[-_])?[A-Z]{1,6}[-_][A-Z\d-]+|GENSET\s*\d+/i);points.push({name,id:idm?.[0]||name,lat,lon});}return normalizeImported(points);}
function parseGeoJSON(content){let data=JSON.parse(content);let features=Array.isArray(data)?data:data.type==='FeatureCollection'?data.features:[data];let points=[];for(let f of features){let g=f.geometry||f,coordinates=g.coordinates;if(g.type!=='Point'||!Array.isArray(coordinates))continue;let p=f.properties||{};points.push({id:p.tag||p.id||f.id||p.name||'GENSET',name:p.name||p.ubicacion||p.location||p.tag||'Ubicación',lat:Number(coordinates[1]),lon:Number(coordinates[0])});}return normalizeImported(points);}
async function unzipKML(file){let b=await file.arrayBuffer(),v=new DataView(b);if(b.byteLength<30)throw Error('KMZ incompleto.');let end=-1;for(let i=b.byteLength-22;i>=Math.max(0,b.byteLength-65557);i--){if(v.getUint32(i,true)===0x06054b50){end=i;break;}}if(end<0)throw Error('No se encontró el índice ZIP del KMZ.');let count=v.getUint16(end+10,true),pos=v.getUint32(end+16,true);if(count>100)throw Error('KMZ con demasiados archivos.');for(let idx=0;idx<count;idx++){if(v.getUint32(pos,true)!==0x02014b50)throw Error('Índice ZIP inválido.');let method=v.getUint16(pos+10,true),sz=v.getUint32(pos+20,true),fnl=v.getUint16(pos+28,true),ex=v.getUint16(pos+30,true),cm=v.getUint16(pos+32,true),off=v.getUint32(pos+42,true),name=new TextDecoder().decode(new Uint8Array(b,pos+46,fnl));if(name.toLowerCase().endsWith('.kml')){if(v.getUint32(off,true)!==0x04034b50)throw Error('Archivo KMZ dañado.');let ln=v.getUint16(off+26,true),le=v.getUint16(off+28,true),dataStart=off+30+ln+le;if(dataStart+sz>b.byteLength)throw Error('KMZ incompleto.');let bytes=new Uint8Array(b,dataStart,sz);if(method===0)return new TextDecoder().decode(bytes);if(method!==8)throw Error('Método ZIP no compatible.');if(typeof DecompressionStream==='undefined')throw Error('Tu navegador necesita actualizarse para leer KMZ.');let stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return new TextDecoder().decode(await new Response(stream).arrayBuffer());}pos+=46+fnl+ex+cm;}throw Error('El KMZ no contiene un archivo .kml.');}
async function importFile(file){if(!file)return;try{if(file.size>8_000_000)throw Error('El archivo es demasiado grande (máximo 8 MB).');let ext=file.name.toLowerCase(),loaded;if(ext.endsWith('.kmz'))loaded=parseKML(await unzipKML(file));else if(ext.endsWith('.kml'))loaded=parseKML(await file.text());else if(ext.endsWith('.geojson')||ext.endsWith('.json'))loaded=parseGeoJSON(await file.text());else throw Error('Selecciona KMZ, KML o GeoJSON.');allPositions=loaded;sourceName=file.name;imported=true;selected=null;satEnabled=false;routeMode='priority';$('modePill').textContent='● KMZ ADICIONAL · LOCAL';render();toast(`Listo: ${loaded.length-1} GENSET cargados solo en este navegador.`);}catch(e){console.warn('Error de lectura local:',e.message);toast(`No se pudo cargar: ${e.message}`);}}
function resetDemo(){allPositions=stationary;imported=false;sourceName='KMZ original · GENSET ESTACIONARIOS';selected=null;satEnabled=false;routeMode='priority';mapState={lat:-11.6600,lon:-76.1300,zoom:11};window.mapFitted=null;render();toast('Restauradas las 19 ubicaciones estacionarias y el Taller del KMZ original.');}
function render(){buildNav();let pages={dashboard,fleet,map:mapPage,alarms:alarmPage,maintenance,qr:qrPage};$('view').innerHTML=pages[view]();if(view==='map')requestAnimationFrame(()=>{if(!window.mapFitted||window.mapFitted!==sourceName){window.mapFitted=sourceName;fitMap();}else redrawMap()});}
function delegate(e){let action=e.target.closest('[data-action]')?.dataset.action,pick=e.target.closest('[data-pick]')?.dataset.pick,newView=e.target.closest('[data-view]')?.dataset.view;if(newView){setView(newView);return;}if(pick){selectPoint(pick);return;}if(!action)return;switch(action){case 'goFleet':setView('fleet');break;case 'resetDemo':resetDemo();break;case 'zoomIn':zoom(1);break;case 'zoomOut':zoom(-1);break;case 'fit':fitMap();break;case 'clearSelected':selected=null;redrawMap();break;case 'satellite':if(!satEnabled){if(!confirm('Activar vista satelital enviará solicitudes de mosaicos con el área del mapa a Esri, un proveedor externo. Si has importado posiciones reales, el proveedor podría inferir la zona consultada. ¿Deseas habilitarla?'))return;satEnabled=true;}else satEnabled=false;render();break;}}
document.addEventListener('click',delegate);
document.addEventListener('change',async e=>{if(e.target.id==='importGeo'){let file=e.target.files?.[0];await importFile(file);}if(e.target.id==='routeMode'){routeMode=e.target.value;selected=null;render()}});
document.addEventListener('input',e=>{if(e.target.id==='fleetSearch'){window.fleetSearch=e.target.value;let caret=e.target.selectionStart;render();let box=$('fleetSearch');box.focus();box.setSelectionRange(caret,caret);}});
document.addEventListener('pointerdown',e=>{let el=e.target.closest('#stationMap');if(!el||e.target.closest('button'))return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,startLat:mapState.lat,startLon:mapState.lon};el.classList.add('grabbing');el.setPointerCapture(e.pointerId);});
document.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;let p=merc(drag.startLat,drag.startLon,mapState.zoom),dx=e.clientX-drag.x,dy=e.clientY-drag.y;let x=p.x-dx,y=p.y-dy,s=256*2**mapState.zoom,lon=x/s*360-180,lat=180/Math.PI*Math.atan(Math.sinh(Math.PI*(1-2*y/s)));mapState.lat=Math.max(-85,Math.min(85,lat));mapState.lon=lon;redrawMap();});
function releaseDrag(e){if(!drag||drag.id!==e.pointerId)return;let el=$('stationMap');el?.classList.remove('grabbing');drag=null;}
document.addEventListener('pointerup',releaseDrag);document.addEventListener('pointercancel',releaseDrag);
document.addEventListener('wheel',e=>{if(e.target.closest('#stationMap')){e.preventDefault();zoom(e.deltaY<0?1:-1)}},{passive:false});
window.addEventListener('resize',()=>{if(view==='map')redrawMap()});
render();
</script>
