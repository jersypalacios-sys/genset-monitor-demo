# EJEMPLO DE DESPLIEGUE PARA DEMOSTRACIÓN AUTORIZADA, NO SISTEMA OT PRODUCTIVO.
# Repositorio PRIVADO. Requiere aprobación TI/OT antes de alojar coordenadas reales.
services:
  - type: web
    name: genset-monitor-360-piloto
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: genset-monitor-360-db
          property: connectionString
      - key: GENSET_ADMIN_USER
        value: administrador
      - key: GENSET_ADMIN_PASSWORD
        sync: false
      - key: GENSET_OPERATOR_USER
        value: operador
      - key: GENSET_OPERATOR_PASSWORD
        sync: false
      - key: GENSET_DEVICE_TOKEN
        sync: false

databases:
  - name: genset-monitor-360-db
    plan: 0.1c-256mb
    databaseName: genset_monitor
    ipAllowList: []
